[project]
name = "anki-mcq-builder"
version = "1.0.0"
description = "CLI tool to generate Material 3 Anki MCQ decks from JSON."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "genanki",
    "typer[all]",
    "jsonschema<=4.18",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
anki-mcq-builder = "cli:app"

[tool.setuptools]
py-modules = ["cli", "core"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
