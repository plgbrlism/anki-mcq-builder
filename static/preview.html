<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCQ preview</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: #101412;
}
</style>
</head>
<body>
<div id="app-root"></div>
<template id="app-template">
<link rel="stylesheet" href="_theme.css">
<link rel="stylesheet" href="style.css">
<div class="m3-mcq-wrapper">
  <div class="m3-check-banner" id="m3-check-banner"></div>
  <div class="m3-question-card">
    <span class="m3-badge">Question</span>
    <h2 class="m3-question-text">Which individual is credited with inventing the first machine algorithm in 1843?</h2>
  </div>
  <div class="m3-options-group" role="radiogroup" aria-label="Choices"></div>
  <div class="m3-show-answer" id="m3-show-answer" role="button" tabindex="0">Show Answer</div>
</div>
</template>

<div id="raw-choices" style="display:none">Grace Murray Hopper<br>Ada Lovelace<br>Kathleen Booth<br>Niklaus Wirth</div>
<div id="raw-answer" style="display:none">Ada Lovelace</div>

<script src="shadow-mount.js"></script>
<script src="_mcq-front.js"></script>
<script>
  var choices = document.getElementById("raw-choices").innerHTML
    .split(/<br\s*\/?>|\n/gi).map(function(s){ return s.trim(); }).filter(Boolean);
  initM3Front(choices, document.getElementById("raw-answer").textContent.trim(), window.__m3ShadowRoot);
</script>
</body>
</html>
