<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCQ preview</title>
<link rel="stylesheet" href="../_theme.css">
<link rel="stylesheet" href="../style.css">
<style>body { margin: 0; background-color: var(--m3-surface); }</style>
</head>
<body>
<div class="card">
  <div class="m3-mcq-wrapper">
    <div class="m3-question-card">
      <span class="m3-badge">Question</span>
      <h2 class="m3-question-text">Which individual is credited with inventing the first machine algorithm in 1843?</h2>
    </div>
    <div class="m3-options-group" id="m3-options-container" role="radiogroup" aria-label="Choices"></div>
  </div>
</div>

<div id="raw-choices" style="display:none">Grace Murray Hopper<br>Ada Lovelace<br>Kathleen Booth<br>Niklaus Wirth</div>

<script src="../_mcq-front.js"></script>
<script>
  const choices = document.getElementById("raw-choices").innerHTML
    .split(/<br\s*[\/]?>|\n/gi)
    .map(s => s.trim())
    .filter(Boolean);
  initM3Front(choices);
</script>
</body>
</html>
